name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/ci-placeholder
      MONGODB_DATABASE: journal_ci
      SITE_URL: https://example.invalid
      # Dedicated loopback server URI: the E2E runner creates and drops its own
      # uniquely named CI database and never starts or stops this MongoDB process.
      E2E_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supercharge/mongodb-github-action@90004df786821b6308fb02299e5835d0dae05d0d # v1.12.0
        with:
          mongodb-version: 8.0
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --audit-level=high
